name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        # Historical identity checks require the local .venv and uv's console launcher.
        run: |
          python -m pip install 'uv==0.11.8'
          python -m venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,lint]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify native lifeline, producer inputs, trusted adapters and recovery
        run: |
          mkdir -p .lunar-evolution/test-results
          python -m pytest -q tests/test_python_producer_binding_store.py tests/test_python_producer_checkpoint.py tests/test_python_producer_recovery.py tests/test_rsi_producer_checkpoint_binding.py tests/test_rsi_producer_reconcile_binding.py tests/test_python_producer_admission_handoff.py --junitxml=.lunar-evolution/test-results/python-producer-recovery.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-producer-recovery.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '116' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Python producer recovery and local handoff require 116 cases and zero failures, errors or skips; fixture recovery is not sealed CPython execution or production admission')"
          python -m pytest -q tests/test_python_producer_admission_gate.py tests/test_python_producer_admission_handoff.py tests/test_python_producer_lifecycle.py --junitxml=.lunar-evolution/test-results/python-admission.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-admission.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '198' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Python admission composition requires 198 cases and zero failures, errors or skips; detached DTO consistency is not sealed CPython runtime or production admission')"
          python -m pytest -q tests/test_producer_bundle_publication.py tests/test_python_handoff_publication_pin.py --junitxml=.lunar-evolution/test-results/python-handoff-pin.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-handoff-pin.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '52' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Original handoff pin publication requires 52 cases and zero failures, errors or skips; local retained identity is not runtime admission or external authentication')"
          python -m pytest -q tests/test_static_python_source_projection.py --junitxml=.lunar-evolution/test-results/python-source-projection.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-source-projection.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '50' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Snapshot-bound Python source projection requires 50 cases and zero failures, errors or skips; this is not release, extraction, build or runtime acceptance')"
          python -m pytest -q tests/test_static_python_archive_observation.py --junitxml=.lunar-evolution/test-results/python-archive-observation.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-archive-observation.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '64' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Local archive observation requires 64 cases and zero failures, errors or skips; inert fixtures do not establish release acquisition, signature, build or runtime acceptance')"
          python -m pytest -q tests/test_static_python_build_inputs.py tests/test_static_python_build_recipe.py tests/test_static_python_source_plan.py --junitxml=.lunar-evolution/test-results/python-build-inputs.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-build-inputs.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '90' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Offline Python build inputs require 90 cases and zero failures, errors or skips; this is not configured closure, compilation or runtime acceptance')"
          python -m pytest -q tests/test_static_python_verified_inputs.py --junitxml=.lunar-evolution/test-results/python-verified-inputs.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-verified-inputs.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '143' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Python verified-input metadata requires 143 cases and zero failures, errors or skips; this is not archive acquisition, signature or extraction acceptance')"
          python -m pytest -q tests/test_static_python_source_patches.py tests/test_static_python_tables.py tests/test_static_python_source_plan.py --junitxml=.lunar-evolution/test-results/python-source-preparation.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-source-preparation.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '100' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Offline Python source preparation requires 100 cases and zero failures, errors or skips; this is not compilation, bytecode or runtime acceptance')"
          python -m pytest -q tests/test_static_python_build_recipe.py tests/test_static_python_installation.py tests/test_static_python_elf.py tests/test_python_producer_binding.py tests/test_python_producer_lifecycle.py --junitxml=.lunar-evolution/test-results/python-preparation.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-preparation.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '226' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Python preparation contract requires 226 cases and zero failures, errors or skips; this is not runtime startup acceptance')"
          python -m pytest -q tests/test_python_fixture_observation.py --junitxml=.lunar-evolution/test-results/python-observation.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-observation.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '43' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Python observation contract requires 43 cases and zero failures, errors or skips; fake-runtime asset observations are not real runtime acceptance')"
          python -m pytest -q tests/test_linux_executable_binding.py tests/test_linux_executable_owner.py tests/test_linux_executable_pair_owner.py tests/test_native_executable_owner.py tests/test_legacy_executable_owner.py --junitxml=.lunar-evolution/test-results/executable-owner.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/executable-owner.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '133' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'executable owner acceptance requires 133 cases and zero failures, errors or skips')"
          python -m pytest -q tests/test_python_runtime_material_format.py tests/test_python_runtime_material_io.py tests/test_producer_python_runtime_material.py --junitxml=.lunar-evolution/test-results/runtime-material.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/runtime-material.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '274' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'runtime material acceptance requires the full focused inventory and zero failures, errors or skips')"
          python -m pytest -q tests/test_native_keyring_control.py --junitxml=.lunar-evolution/test-results/keyring-control.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/keyring-control.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '52' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'keyring acceptance requires 52 cases and zero failures, errors or skips')"
          python -m pytest -q tests/test_native_kernel_route_control.py --junitxml=.lunar-evolution/test-results/kernel-route-control.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/kernel-route-control.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '11' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'kernel route acceptance requires 11 cases and zero failures, errors or skips')"
          python -m pytest -q tests/test_producer_broker_http_destination.py --junitxml=.lunar-evolution/test-results/broker-destination.xml
          python -m pytest -q tests/test_native_named_ipc_control.py --junitxml=.lunar-evolution/test-results/posix-mq.xml
          python -m pytest -q tests/test_native_python_pipe_fixture.py --junitxml=.lunar-evolution/test-results/python-pipe.xml
          python -m pytest -q tests/test_native_ipc_control.py --junitxml=.lunar-evolution/test-results/ipc-control.xml
          python -m pytest -q tests/test_native_grant_objects.py tests/test_native_grant_control.py tests/test_native_grant_inputs.py --junitxml=.lunar-evolution/test-results/grant-objects.xml
          python -m pytest -q tests/test_producer_grant_anchors.py --junitxml=.lunar-evolution/test-results/grant-anchors.xml
          python -m pytest -q tests/test_native_fd_control.py --junitxml=.lunar-evolution/test-results/fd-control.xml
          python -m pytest -q tests/test_native_fd_handoff.py --junitxml=.lunar-evolution/test-results/fd-handoff.xml
          python -m pytest -q tests/test_native_input_mutation_isolation.py --junitxml=.lunar-evolution/test-results/input-mutation.xml
          python -m pytest -q tests/test_producer_python_runtime_tree.py --junitxml=.lunar-evolution/test-results/runtime-tree.xml
          python -m pytest -q tests/test_native_trusted_failure.py tests/test_native_trusted_scheduler_outcome.py tests/test_rsi_native_failure_provenance.py tests/test_rsi_native_failure_gateway.py tests/test_rsi_native_failure_controller.py --junitxml=.lunar-evolution/test-results/known-failure.xml
          python -m pytest -q tests/test_native_child_supervision_binding.py tests/test_native_descendants_drain.py --junitxml=.lunar-evolution/test-results/descendants-drain.xml
          python -m pytest -q tests/test_native_guardian_host.py tests/test_native_independent_guardian.py tests/test_native_guardian_readiness.py --junitxml=.lunar-evolution/test-results/independent-guardian.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/independent-guardian.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '82' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Independent guardian readiness requires 82 Linux cases and zero failures, errors or skips')"
          python -m pytest -q tests/test_native_deadline_binding.py tests/test_native_deadline_anchor.py tests/test_producer_bootstrap.py tests/test_trusted_bootstrap_claim.py tests/test_trusted_bootstrap_registration.py tests/test_trusted_worker_evidence.py --junitxml=.lunar-evolution/test-results/deadline-anchor.xml
          python -m pytest -q tests/test_producer_python_runtime.py tests/test_native_target_control_isolation.py tests/test_native_isolation_architecture.py --junitxml=.lunar-evolution/test-results/runtime-preflight.xml
          python -m pytest -q tests/test_producer_launch_inputs.py tests/test_native_producer_launch_inputs.py tests/test_seed_retained_admission.py tests/test_openevolve_native.py --junitxml=.lunar-evolution/test-results/trusted-adapters.xml
          python -m pytest -q tests/test_process_ownership.py tests/test_producer_process.py tests/test_native_trusted_attempt.py tests/test_native_trusted_controller_death.py tests/test_native_trusted_deadline_guard.py tests/test_native_input_permission_isolation.py tests/test_native_trusted_scheduler_e2e.py tests/test_native_trusted_broker_cancellation_e2e.py tests/test_controller_broker_cancellation.py tests/test_controller_broker_crash_recovery.py tests/test_rsi_native_inputs.py tests/test_rsi_native_retained.py tests/test_rsi_durable_gateway.py tests/test_rsi_durable_gateway_controller.py tests/test_acceptance_campaign_audit.py --junitxml=.lunar-evolution/test-results/native-cleanup.xml
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .lunar-evolution/test-results
          python tools/run_tests.py --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
      - name: Annotate test failures
        if: ${{ always() }}
        run: python tools/annotate_test_failures.py .lunar-evolution/test-results/python-producer-recovery.xml .lunar-evolution/test-results/python-admission.xml .lunar-evolution/test-results/python-handoff-pin.xml .lunar-evolution/test-results/python-source-projection.xml .lunar-evolution/test-results/python-archive-observation.xml .lunar-evolution/test-results/python-build-inputs.xml .lunar-evolution/test-results/python-verified-inputs.xml .lunar-evolution/test-results/python-source-preparation.xml .lunar-evolution/test-results/python-preparation.xml .lunar-evolution/test-results/python-observation.xml .lunar-evolution/test-results/executable-owner.xml .lunar-evolution/test-results/runtime-material.xml .lunar-evolution/test-results/keyring-control.xml .lunar-evolution/test-results/kernel-route-control.xml .lunar-evolution/test-results/broker-destination.xml .lunar-evolution/test-results/posix-mq.xml .lunar-evolution/test-results/python-pipe.xml .lunar-evolution/test-results/ipc-control.xml .lunar-evolution/test-results/grant-objects.xml .lunar-evolution/test-results/grant-anchors.xml .lunar-evolution/test-results/fd-control.xml .lunar-evolution/test-results/fd-handoff.xml .lunar-evolution/test-results/input-mutation.xml .lunar-evolution/test-results/runtime-tree.xml .lunar-evolution/test-results/known-failure.xml .lunar-evolution/test-results/descendants-drain.xml .lunar-evolution/test-results/independent-guardian.xml .lunar-evolution/test-results/deadline-anchor.xml .lunar-evolution/test-results/runtime-preflight.xml .lunar-evolution/test-results/trusted-adapters.xml .lunar-evolution/test-results/native-cleanup.xml .lunar-evolution/test-results/current.xml .lunar-evolution/test-results/archived.xml .lunar-evolution/test-results/frozen123.xml --archive-retry .lunar-evolution/test-results/archived.retry1.xml
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            .lunar-evolution/test-results/python-producer-recovery.xml
            .lunar-evolution/test-results/python-admission.xml
            .lunar-evolution/test-results/python-handoff-pin.xml
            .lunar-evolution/test-results/python-source-projection.xml
            .lunar-evolution/test-results/python-archive-observation.xml
            .lunar-evolution/test-results/python-build-inputs.xml
            .lunar-evolution/test-results/python-verified-inputs.xml
            .lunar-evolution/test-results/python-source-preparation.xml
            .lunar-evolution/test-results/python-preparation.xml
            .lunar-evolution/test-results/python-observation.xml
            .lunar-evolution/test-results/executable-owner.xml
            .lunar-evolution/test-results/runtime-material.xml
            .lunar-evolution/test-results/keyring-control.xml
            .lunar-evolution/test-results/kernel-route-control.xml
            .lunar-evolution/test-results/broker-destination.xml
            .lunar-evolution/test-results/posix-mq.xml
            .lunar-evolution/test-results/python-pipe.xml
            .lunar-evolution/test-results/ipc-control.xml
            .lunar-evolution/test-results/grant-objects.xml
            .lunar-evolution/test-results/grant-anchors.xml
            .lunar-evolution/test-results/fd-control.xml
            .lunar-evolution/test-results/fd-handoff.xml
            .lunar-evolution/test-results/input-mutation.xml
            .lunar-evolution/test-results/runtime-tree.xml
            .lunar-evolution/test-results/known-failure.xml
            .lunar-evolution/test-results/descendants-drain.xml
            .lunar-evolution/test-results/independent-guardian.xml
            .lunar-evolution/test-results/deadline-anchor.xml
            .lunar-evolution/test-results/runtime-preflight.xml
            .lunar-evolution/test-results/trusted-adapters.xml
            .lunar-evolution/test-results/native-cleanup.xml
            .lunar-evolution/test-results/current.xml
            .lunar-evolution/test-results/archived.xml
            .lunar-evolution/test-results/archived.retry1.xml
            .lunar-evolution/test-results/frozen123.xml
            .lunar-evolution/test-results/pytest.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Static checks
        if: ${{ always() }}
        run: ruff check src tests tools
