      - name: Run current regression shard
        if: ${{ startsWith(matrix.role, 'current-') }}
        shell: bash
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: |
          set -o pipefail
          python tools/run_tests.py --suite current --shard-index "${LUNAR_CI_TEST_ROLE#current-}" --shard-count 6 --isolate-heavy --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
