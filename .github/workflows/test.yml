name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        # Historical identity checks require the local .venv and uv's console launcher.
        run: |
          python -m pip install 'uv==0.11.8'
          python -m venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,lint]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .lunar-evolution/test-results
          python tools/run_tests.py --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
      - name: Annotate test failures
        if: ${{ always() }}
        run: python tools/annotate_test_failures.py .lunar-evolution/test-results/current.xml .lunar-evolution/test-results/archived.xml .lunar-evolution/test-results/frozen123.xml
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            .lunar-evolution/test-results/current.xml
            .lunar-evolution/test-results/archived.xml
            .lunar-evolution/test-results/frozen123.xml
            .lunar-evolution/test-results/pytest.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Static checks
        run: ruff check src tests tools
