name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        role: ["current-0", "current-1", "current-2", "current-3", "current-4", "current-5", "heavy-0", "heavy-1", "heavy-2", "heavy-3", "heavy-4", "heavy-5", "heavy-6", "history"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        # Historical identity checks require the local .venv and uv's console launcher.
        # Collection IDs are part of the immutable historical inventory.
        run: |
          python -m pip install 'uv==0.11.8'
          python -m venv .venv
          uv sync --locked --no-python-downloads --extra dev --extra lint
          # Historical snapshots resolve offline by registry requirement. A
          # lockfile sync alone caches wheels without all resolver metadata.
          mkdir -p .lunar-evolution/ci-dependencies
          uv export --locked --no-hashes --no-emit-project --extra dev --extra lint --output-file .lunar-evolution/ci-dependencies/ci-locked-requirements.txt
          uv pip compile --no-config --no-python-downloads --python .venv/bin/python .lunar-evolution/ci-dependencies/ci-locked-requirements.txt --output-file .lunar-evolution/ci-dependencies/ci-registry-metadata.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Record job source and import provenance
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: |
          python - <<'PYCODE'
          import importlib.util, json, os, pathlib, sys
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("ci_runner", root / "tools/run_tests.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          roles = {"current-0", "current-1", "current-2", "current-3", "current-4", "current-5", "heavy-0", "heavy-1", "heavy-2", "heavy-3", "heavy-4", "heavy-5", "heavy-6", "history"}
          role = os.environ["LUNAR_CI_TEST_ROLE"]
          if role not in roles:
              raise SystemExit("Invalid CI role")
          provenance = {
              "schema": "lunar-ci-job-provenance-v1", "role": role,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": runner._git(root, "rev-parse", "HEAD"),
              "tree": runner._git(root, "rev-parse", "HEAD^{tree}"),
              "parents": runner._git(root, "rev-list", "--parents", "-n", "1", "HEAD").split()[1:],
              "imports": runner._verify_imports(root),
              "python": sys.version, "executable": sys.executable,
          }
          directory = root / ".lunar-evolution/test-results"
          directory.mkdir(parents=True, exist_ok=True)
          raw = json.dumps(provenance, sort_keys=True) + "\n"
          with (directory / "job-provenance.json").open("x") as output:
              output.write(raw)
          print(raw, end="", flush=True)
          PYCODE
      - name: Run current regression shard
        if: ${{ startsWith(matrix.role, 'current-') }}
        shell: bash
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: |
          set -o pipefail
          python tools/run_tests.py --suite current --shard-index "${LUNAR_CI_TEST_ROLE#current-}" --shard-count 6 --isolate-heavy --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
      - name: Run explicit heavy regression node
        if: ${{ startsWith(matrix.role, 'heavy-') }}
        shell: bash
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: |
          set -o pipefail
          python tools/run_tests.py --suite current-heavy --heavy-index "${LUNAR_CI_TEST_ROLE#heavy-}" --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
      - name: Run historical regressions
        if: ${{ matrix.role == 'history' }}
        shell: bash
        run: |
          set -o pipefail
          python tools/run_tests.py --suite history --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
      - name: Annotate current shard failures
        if: ${{ always() && startsWith(matrix.role, 'current-') }}
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: python tools/annotate_test_failures.py ".lunar-evolution/test-results/current-shard-${LUNAR_CI_TEST_ROLE#current-}.xml"
      - name: Annotate heavy node failures
        if: ${{ always() && startsWith(matrix.role, 'heavy-') }}
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: python tools/annotate_test_failures.py ".lunar-evolution/test-results/current-heavy-${LUNAR_CI_TEST_ROLE#heavy-}.xml"
      - name: Annotate historical test failures
        if: ${{ always() && matrix.role == 'history' }}
        run: python tools/annotate_test_failures.py .lunar-evolution/test-results/archived.xml .lunar-evolution/test-results/frozen123.xml --archive-retry .lunar-evolution/test-results/archived.retry1.xml
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}-${{ matrix.role }}
          path: .lunar-evolution/test-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Static checks
        if: ${{ always() }}
        run: ruff check src tests tools

  focused:
    name: Focused gates (Python ${{ matrix.python-version }})
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install aggregate dependencies
        run: |
          python -m pip install 'uv==0.11.8'
          python -m venv .venv
          uv sync --locked --no-python-downloads --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Download original current shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-python-${{ matrix.python-version }}-current-*
          path: .lunar-evolution/focused-inputs
      - name: Download original heavy node reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-python-${{ matrix.python-version }}-heavy-*
          path: .lunar-evolution/focused-inputs
      - name: Verify focused gates from original reports
        if: ${{ always() }}
        shell: bash
        env:
          LUNAR_CI_UPSTREAM_RESULT: ${{ needs.test.result }}
        run: |
          set -o pipefail
          mkdir -p .lunar-evolution/test-results
          python tools/aggregate_focused_ci.py --artifacts-dir .lunar-evolution/focused-inputs --python-version "${{ matrix.python-version }}" --upstream-result "$LUNAR_CI_UPSTREAM_RESULT" --output .lunar-evolution/test-results/focused-gate.summary.json 2>&1 | tee .lunar-evolution/test-results/focused-gate.log
      - name: Preserve derived focused gate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-gate-python-${{ matrix.python-version }}
          path: .lunar-evolution/test-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
