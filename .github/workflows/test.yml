name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        role: ["focused", "current-0", "current-1", "current-2", "current-3", "current-4", "current-5", "heavy-0", "heavy-1", "heavy-2", "history"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        # Historical identity checks require the local .venv and uv's console launcher.
        run: |
          python -m pip install 'uv==0.11.8'
          python -m venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,lint]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Record job source and import provenance
        env:
          LUNAR_CI_TEST_ROLE: ${{ matrix.role }}
        run: |
          python - <<'PYCODE'
          import importlib.util, json, os, pathlib, sys
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("ci_runner", root / "tools/run_tests.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          roles = {"focused", "current-0", "current-1", "current-2", "current-3", "current-4", "current-5", "heavy-0", "heavy-1", "heavy-2", "history"}
          role = os.environ["LUNAR_CI_TEST_ROLE"]
          if role not in roles:
              raise SystemExit("Invalid CI role")
          provenance = {
              "schema": "lunar-ci-job-provenance-v1", "role": role,
              "commit": runner._git(root, "rev-parse", "HEAD"),
              "tree": runner._git(root, "rev-parse", "HEAD^{tree}"),
              "parents": runner._git(root, "rev-list", "--parents", "-n", "1", "HEAD").split()[1:],
              "imports": runner._verify_imports(root),
              "python": sys.version, "executable": sys.executable,
          }
          directory = root / ".lunar-evolution/test-results"
          directory.mkdir(parents=True, exist_ok=True)
          raw = json.dumps(provenance, sort_keys=True) + "\n"
          with (directory / "job-provenance.json").open("x") as output:
              output.write(raw)
          print(raw, end="", flush=True)
          PYCODE
      - name: Verify deterministic current shards and historical runner compatibility
        if: ${{ matrix.role == 'focused' }}
        run: |
          python -m pytest -q tests/test_regression_runner_shards.py --junitxml=.lunar-evolution/test-results/regression-shards.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/regression-shards.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '204' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Parallel regression runner requires 204 cases and zero failures, errors or skips')"
      - name: Verify detached RSI marker installation description contract
        if: ${{ matrix.role == 'focused' }}
        run: |
          python -m pytest -q tests/test_static_python_rsi_installation_contract.py --junitxml=.lunar-evolution/test-results/python-rsi-installation-contract.xml
          python -c "import sys, xml.etree.ElementTree as E; s = E.parse('.lunar-evolution/test-results/python-rsi-installation-contract.xml').getroot().find('testsuite'); sys.exit(0 if s is not None and s.get('tests') == '189' and all(s.get(k) == '0' for k in ('failures', 'errors', 'skipped')) else 'Detached RSI installation contract requires 189 cases and zero failures, errors or skips; synthetic metadata comparison does not establish actual installation, build or runtime acceptance')"
      - name: Verify native lifeline, producer inputs, trusted adapters and recovery
