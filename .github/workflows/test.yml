name: test

on:
  push:
    branches: [main, codex/rsi-recovery-integration]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up CPython (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Miniforge (macOS)
        # CoreFoundation-linked Python adds a child environment key that the frozen
        # archived probe does not accept. Conda Python preserves its original contract.
        if: matrix.os == 'macos-latest'
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: lunar-ci
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        # Historical identity checks require the local .venv and uv's console launcher.
        shell: bash -el {0}
        run: |
          python -m pip install 'uv==0.11.8'
          python -m venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,lint]'
      - name: Run tests
        shell: bash -el {0}
        run: |
          set -o pipefail
          mkdir -p .lunar-evolution/test-results
          .venv/bin/python tools/run_tests.py --junit-dir .lunar-evolution/test-results 2>&1 | tee .lunar-evolution/test-results/pytest.log
      - name: Annotate test failures
        if: ${{ always() }}
        shell: bash -el {0}
        run: .venv/bin/python tools/annotate_test_failures.py .lunar-evolution/test-results/current.xml .lunar-evolution/test-results/archived.xml .lunar-evolution/test-results/frozen123.xml
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            .lunar-evolution/test-results/current.xml
            .lunar-evolution/test-results/archived.xml
            .lunar-evolution/test-results/frozen123.xml
            .lunar-evolution/test-results/pytest.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Static checks
        shell: bash -el {0}
        run: .venv/bin/ruff check src tests tools
